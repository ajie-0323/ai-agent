spring:
  application:
    name: ai-agent
  profiles:
    active: local
server:
  port: 8123  #端口号
  servlet:
    context-path: /api #区分前后全端接口地址
  # springdoc-openapi 接口文档配置
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
    api-docs:
      path: /v3/api-docs
    group-configs:
      - group: 'default'
        paths-to-match: '/**'
        packages-to-scan: com.donggua.aiagent.controller
  # knife4j的增强配置，不需要增强可以不配
  knife4j:
    enable: true
    setting:
      language: zh_cn
#Search Api Key
search-api:
  api-key: SKLgWakjpnxrUfDCcE6tw7va
